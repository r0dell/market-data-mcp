[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-market-data-mcp"
version = "0.2.0"
description = "MCP server with 33 paid market-data tools (exchange hours, futures expiry, economic and central bank calendars, Treasury yields and auctions, ECB FX, CFTC COT, contract specs), paid per call with x402 (USDC on Base)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "x402", "trading", "market-hours", "futures", "treasury", "ecb", "cot", "usdc", "base"]
dependencies = [
  "mcp>=1.10,<2",
  "x402[evm,clients]==2.25.0",
  "requests>=2.31",
  "eth-account>=0.13",
  "certifi",
  "truststore>=0.9",
]

[project.urls]
Homepage = "https://github.com/r0dell/market-data-mcp"

[project.scripts]
market-data-mcp = "market_data_mcp:main"

[tool.setuptools]
py-modules = ["market_data_mcp"]
